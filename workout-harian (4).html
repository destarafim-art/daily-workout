<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>WORKOUT HARIAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F0D0B;
    --ink-2:#141110;
    --panel:#18140F;
    --panel-2:#201A12;
    --brass:#C3986B;
    --brass-2:#E4C39A;
    --oxblood:#7B2C36;
    --bone:#ECE3D4;
    --faint:#8D8375;
    --line:rgba(236,227,212,0.10);
    --shadow:rgba(0,0,0,0.5);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{ font:inherit; color:inherit; background:none; border:none; padding:0; margin:0; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3,p,ul{ margin:0; padding:0; list-style:none; }
  img,svg{ display:block; }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:3px; border-radius:4px; }

  .display{ font-family:'Bodoni Moda','Didot',Georgia,serif; }

  /* ---------- background texture ---------- */
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5; mix-blend-mode:overlay;
    background-image:radial-gradient(circle at 20% 20%, rgba(195,152,107,0.05), transparent 60%),
                      radial-gradient(circle at 80% 0%, rgba(123,44,54,0.06), transparent 55%);
  }

  /* ================= LANDING ================= */
  #landing{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(195,152,107,0.10), transparent 55%),
      var(--ink);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #landing.leaving{ opacity:0; pointer-events:none; }
  .landing-inner{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:32px; max-width:420px;
    animation:riseIn 1s ease both;
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  .landing-eyebrow{
    font-size:11px; letter-spacing:0.22em; color:var(--faint); text-transform:uppercase; margin-bottom:22px;
  }
  .landing-title{
    line-height:0.92; color:var(--bone);
    font-size:clamp(2.6rem, 13vw, 4rem);
    font-weight:600; font-style:italic;
  }
  .landing-title .accent{ color:var(--brass); display:block; }
  .landing-rule{
    width:64px; height:1px; background:var(--line); margin:28px 0; position:relative;
  }
  .landing-rule::after{
    content:'◆'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:8px; color:var(--brass); background:var(--ink); padding:0 8px;
  }
  .tap-btn{
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .tap-ring{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    animation:pulseRing 2.4s ease-in-out infinite;
    color:var(--brass);
  }
  @keyframes pulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(195,152,107,0.18); }
    50%{ box-shadow:0 0 0 10px rgba(195,152,107,0); }
  }
  .tap-label{ font-size:11px; letter-spacing:0.2em; color:var(--brass-2); }
  .landing-foot{ margin-top:26px; font-size:12px; color:var(--faint); max-width:260px; line-height:1.5; }

  /* ================= APP ================= */
  #app{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto; padding:22px 20px 56px;
    opacity:0; transform:translateY(6px);
    transition:opacity .6s ease .15s, transform .6s ease .15s;
  }
  #app.visible{ opacity:1; transform:translateY(0); }

  .app-header{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:4px; }
  .wordmark{ font-size:15px; letter-spacing:0.08em; color:var(--bone); font-weight:600; }
  .wordmark span{ color:var(--brass); }
  .header-controls{ display:flex; align-items:center; gap:10px; }

  .streak-badge{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--brass-2);
    border:1px solid var(--line); padding:5px 9px; border-radius:999px;
  }
  .streak-badge svg{ width:12px; height:12px; color:var(--oxblood); }
  .streak-badge[hidden]{ display:none; }

  .mute-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--faint);
    transition:color .2s ease, border-color .2s ease;
  }
  .mute-btn:hover{ color:var(--brass); border-color:var(--brass); }
  .mute-btn svg{ width:15px; height:15px; }

  .date-eyebrow{
    margin-top:14px; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--faint);
  }

  /* ---------- week strip ---------- */
  .week-strip{
    display:flex; gap:6px; margin-top:18px;
  }
  .day-pill{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:9px 2px 10px; border-radius:12px; border:1px solid var(--line);
    transition:border-color .2s ease, background .2s ease;
  }
  .day-pill.is-today{ border-color:rgba(195,152,107,0.4); }
  .day-pill.is-active{ background:var(--panel); border-color:var(--brass); }
  .day-pill-label{ font-size:11px; letter-spacing:0.05em; color:var(--faint); font-weight:600; }
  .day-pill.is-active .day-pill-label{ color:var(--brass-2); }
  .day-pill.is-today .day-pill-label{ color:var(--bone); }
  .day-pill-cat{ font-size:8.5px; letter-spacing:0.03em; color:var(--faint); opacity:0.75; text-align:center; }
  .day-pill.is-active .day-pill-cat{ color:var(--brass); opacity:1; }
  .day-pill-dot{ width:3px; height:3px; border-radius:50%; background:var(--faint); margin-top:1px; }
  .day-pill.is-today .day-pill-dot{ background:var(--brass); }

  /* ---------- session card ---------- */
  .session-card{
    position:relative; margin-top:20px; background:var(--panel);
    border:1px solid var(--line); border-radius:18px; padding:22px 20px 20px;
    overflow:hidden;
  }
  .card-row--top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .tag-pill{
    font-size:10.5px; letter-spacing:0.14em; padding:5px 10px; border-radius:999px; font-weight:600;
  }
  .tag-pill--today{ border:1px solid var(--brass); color:var(--brass-2); }
  .tag-pill--done{ background:var(--brass); color:var(--ink); }
  .tag-pill--preview{ border:1px solid var(--line); color:var(--faint); }
  .progress-caption{ font-size:11.5px; color:var(--faint); }

  .card-title{
    font-family:'Bodoni Moda',Georgia,serif; font-weight:600; font-size:28px;
    color:var(--bone); margin-top:14px; letter-spacing:0.01em;
  }
  .card-tip{
    margin-top:7px; font-size:13px; font-style:italic; color:var(--faint); line-height:1.5; max-width:38ch;
  }

  .back-today-btn{
    margin-top:12px; font-size:12px; color:var(--brass); border-bottom:1px solid rgba(195,152,107,0.4); padding-bottom:1px;
    display:inline-block;
  }
  .back-today-btn[hidden]{ display:none; }

  .divider{ height:1px; background:var(--line); margin:18px 0; }

  .ex-list{ display:flex; flex-direction:column; gap:2px; }
  .ex-row{
    display:flex; align-items:center; gap:13px; width:100%; padding:10px 6px; border-radius:10px;
    transition:background .15s ease;
  }
  button.ex-row:hover{ background:var(--panel-2); }
  .ex-num{
    font-family:'Bodoni Moda',Georgia,serif; font-size:12px; color:var(--faint); width:18px; flex-shrink:0;
  }
  .ex-check{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--faint);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background .18s ease, border-color .18s ease;
  }
  .ex-check svg{ width:12px; height:12px; color:var(--ink); opacity:0; transform:scale(0.5); transition:all .18s ease; }
  .ex-row[aria-checked="true"] .ex-check{ background:var(--brass); border-color:var(--brass); }
  .ex-row[aria-checked="true"] .ex-check svg{ opacity:1; transform:scale(1); }
  .ex-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ex-name{ font-size:14.5px; color:var(--bone); transition:color .18s ease, opacity .18s ease; }
  .ex-row[aria-checked="true"] .ex-name{ color:var(--faint); text-decoration:line-through; text-decoration-color:rgba(141,131,117,0.5); }
  .ex-detail{ font-size:12px; color:var(--faint); }
  .ex-row--preview{ opacity:0.85; }
  .ex-row--preview .ex-num{ width:22px; }

  .progress-track{ height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:16px; }
  .progress-fill{ height:100%; width:0%; background:var(--brass); border-radius:2px; transition:width .35s ease; }
  .progress-track[hidden]{ display:none; }

  /* ---------- stamp overlay ---------- */
  .stamp-overlay{
    position:absolute; inset:0; z-index:5; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:rgba(15,13,11,0.94);
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .stamp-overlay.play{ opacity:1; }
  .seal{ position:relative; width:84px; height:84px; color:var(--brass); }
  .seal-ring, .seal-icon{ position:absolute; inset:0; width:100%; height:100%; }
  .seal-icon{ color:var(--brass); }
  .stamp-overlay .seal{ transform:scale(2.2) rotate(-10deg); opacity:0; }
  .stamp-overlay.play .seal{ animation:stampIn .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes stampIn{
    0%{ transform:scale(2.4) rotate(-10deg); opacity:0; }
    55%{ transform:scale(0.94) rotate(-6deg); opacity:1; }
    75%{ transform:scale(1.05) rotate(-6deg); }
    100%{ transform:scale(1) rotate(-6deg); opacity:1; }
  }
  .stamp-label{
    font-size:12px; letter-spacing:0.3em; color:var(--brass-2); opacity:0; transition:opacity .3s ease .3s;
  }
  .stamp-overlay.play .stamp-label{ opacity:1; }

  /* ================= POPUP ================= */
  .popup-overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(8,7,6,0.72); backdrop-filter:blur(3px);
    opacity:0; visibility:hidden; transition:opacity .35s ease, visibility .35s ease;
  }
  .popup-overlay.open{ opacity:1; visibility:visible; }
  .popup-card{
    position:relative; width:100%; max-width:380px; background:var(--panel);
    border:1px solid rgba(195,152,107,0.25); border-radius:20px; padding:30px 26px 26px;
    text-align:center; transform:translateY(14px) scale(0.98); transition:transform .35s ease;
    box-shadow:0 24px 60px var(--shadow);
  }
  .popup-overlay.open .popup-card{ transform:translateY(0) scale(1); }
  .popup-close{
    position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:var(--faint); border:1px solid var(--line);
  }
  .popup-close:hover{ color:var(--bone); border-color:var(--brass); }
  .popup-close svg{ width:12px; height:12px; }
  .popup-seal{ width:60px; height:60px; color:var(--brass); margin:0 auto 16px; position:relative; }
  .popup-eyebrow{ font-size:11px; letter-spacing:0.24em; color:var(--brass); text-transform:uppercase; }
  .popup-title{
    font-family:'Bodoni Moda',Georgia,serif; font-style:italic; font-weight:600; font-size:26px;
    color:var(--bone); margin-top:8px;
  }
  .popup-body{ margin-top:16px; font-size:14px; line-height:1.65; color:var(--bone); opacity:0.9; text-align:left; }
  .popup-bullets{ margin-top:16px; display:flex; flex-direction:column; gap:9px; text-align:left; }
  .popup-bullets li{ font-size:13px; line-height:1.5; color:var(--faint); padding-left:16px; position:relative; }
  .popup-bullets li::before{ content:'—'; position:absolute; left:0; top:0; color:var(--brass); }
  .popup-streak{ margin-top:16px; font-size:12px; color:var(--brass-2); }
  .popup-streak[hidden]{ display:none; }
  .popup-btn{
    margin-top:24px; width:100%; padding:13px; border-radius:12px; border:1px solid var(--brass);
    color:var(--brass-2); font-size:13px; letter-spacing:0.1em; text-align:center; text-transform:uppercase;
    transition:background .2s ease, color .2s ease;
  }
  .popup-btn:hover{ background:var(--brass); color:var(--ink); }

  @media (max-width:360px){
    .card-title{ font-size:24px; }
    .day-pill-cat{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.01ms !important; animation-iteration-count:1 !important;
      transition-duration:0.01ms !important; scroll-behavior:auto !important;
    }
  }
</style>
</head>

    <div class="landing-eyebrow">Jurnal Latihan Pribadi</div>
    <h1 class="landing-title">WORKOUT<span class="accent">HARIAN</span></h1>
    <div class="landing-rule"></div>
    <button class="tap-btn" id="enterBtn" aria-label="Ketuk untuk mulai">
      <span class="tap-ring">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="M16 9c1.2 1 1.2 5 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.6 7c2.2 2 2.2 8 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
        </svg>
      </span>
      <span class="tap-label">KETUK UNTUK MULAI</span>
    </button>
    <p class="landing-foot">Audio akan diputar dan berulang selama sesi berlangsung. Bisa dimatikan kapan saja.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<main id="app">
  <header class="app-header">
    <div class="wordmark">WORKOUT <span>HARIAN</span></div>
    <div class="header-controls">
      <span class="streak-badge" id="streakBadge" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-.5-1.8-1-2.5 1.5.5 3 2 3 4.5a5 5 0 01-10 0C7 7 10 6 12 2z"/></svg>
        <span id="streakCount">0</span>
      </span>
      <button class="mute-btn" id="muteBtn" aria-label="Matikan suara">
        <svg id="muteIconOn" viewBox="0 0 24 24" fill="none">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="M16 9c1.2 1 1.2 5 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.6 7c2.2 2 2.2 8 0 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <svg id="muteIconOff" viewBox="0 0 24 24" fill="none" style="display:none">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <line x1="15.5" y1="8.5" x2="21" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="21" y1="8.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="date-eyebrow" id="dateEyebrow">—</div>

  <nav class="week-strip" id="weekStrip" aria-label="Pilih hari"></nav>

  <section class="session-card" id="sessionCard" aria-live="polite">
    <div class="stamp-overlay" id="stampOverlay">
      <div class="seal">
        <svg class="seal-ring" viewBox="0 0 100 100"><use href="#seal-ring"/></svg>
        <svg class="seal-icon" viewBox="0 0 100 100"><path d="M28 52 L44 68 L74 32" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="stamp-label">SELESAI</div>
    </div>

    <div class="card-row--top">
      <span class="tag-pill" id="tagPill">HARI INI</span>
      <span class="progress-caption" id="progressCaption">0/0 selesai</span>
    </div>

    <h2 class="card-title" id="cardTitle">—</h2>
    <p class="card-tip" id="cardTip">—</p>
    <button class="back-today-btn" id="backTodayBtn" hidden>← Kembali ke hari ini</button>

    <div class="divider"></div>
    <div class="ex-list" id="exList"></div>
    <div class="divider"></div>

    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
  </section>
</main>

<!-- ================= POPUP ================= -->
<div class="popup-overlay" id="popupOverlay" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="popup-card">
    <button class="popup-close" id="popupCloseX" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="popup-seal">
      <svg class="seal-ring" viewBox="0 0 100 100"><use href="#seal-ring"/></svg>
      <svg viewBox="0 0 100 100" style="position:absolute;inset:0;color:var(--brass)">
        <circle cx="50" cy="50" r="17" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="50" cy="50" r="7" fill="currentColor"/>
      </svg>
    </div>
    <div class="popup-eyebrow" id="popupEyebrow">SESI SELESAI</div>
    <h3 class="popup-title" id="popupTitle">Target Kamu.</h3>
    <p class="popup-body" id="popupBody">—</p>
    <ul class="popup-bullets" id="popupBullets"></ul>
    <p class="popup-streak" id="popupStreak" hidden>—</p>
    <button class="popup-btn" id="popupCloseBtn">Lanjut</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- data ---------------- */
  var DOW_SHORT = {1:'SEN',2:'SEL',3:'RAB',4:'KAM',5:'JUM',6:'SAB',0:'MIN'};
  var DOW_FULL  = {0:'Minggu',1:'Senin',2:'Selasa',3:'Rabu',4:'Kamis',5:'Jumat',6:'Sabtu'};
  var MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var WEEK_ORDER = [1,2,3,4,5,6,0];

  var WEEK_PLAN = {
    1:{ key:'chest_tri', type:'training', label:'Dada & Trisep', shortLabel:'Dada',
        tip:'Kontrol gerakan turun, jangan buru-buru — dada kerja lebih maksimal.',
        exercises:[
          {id:'e1',name:'Push Up',detail:'2 set × to failure'},
          {id:'e2',name:'Decline Push Up',detail:'2 set × to failure'},
          {id:'e3',name:'Diamond Push Up',detail:'12 reps'},
          {id:'e4',name:'Overhead Dumbbell Extension',detail:'2 set × to failure'},
          {id:'e5',name:'Tricep Kickback',detail:'2 set × to failure'}
        ]},
    3:{ key:'back_bi', type:'training', label:'Punggung & Bisep', shortLabel:'Punggung',
        tip:'Tarik dari punggung, bukan cuma tangan. Rasakan kontraksinya.',
        exercises:[
          {id:'e1',name:'Wide Grip Row',detail:'2 set × to failure'},
          {id:'e2',name:'Close Grip Row',detail:'2 set × to failure'},
          {id:'e3',name:'Dumbbell Shrug',detail:'2 set × to failure'},
          {id:'e4',name:'Concentration Curl',detail:'2 set × to failure'},
          {id:'e5',name:'Hammer Curl',detail:'2 set × to failure'},
          {id:'e6',name:'Drag Curl',detail:'2 set × to failure'}
        ]},
    5:{ key:'leg_abs', type:'training', label:'Kaki & Perut', shortLabel:'Kaki',
        tip:'Jaga postur, lutut sejajar ujung kaki. Kuat dari bawah, kuat semua.',
        exercises:[
          {id:'e1',name:'Squat',detail:'2 set × to failure'},
          {id:'e2',name:'Lunges',detail:'2 set × to failure'},
          {id:'e3',name:'RDL',detail:'2 set × to failure'},
          {id:'e4',name:'Calf Raises',detail:'2 set × 35 repetisi'},
          {id:'e5',name:'Plank',detail:'2 menit'}
        ]},
    6:{ key:'cardio', type:'training', label:'Kardio', shortLabel:'Kardio',
        tip:'Jaga detak jantung di zona sedang, fokus ke napas yang stabil.',
        exercises:[
          {id:'e1',name:'Jogging / Lari di Tempat',detail:'20–25 menit'},
          {id:'e2',name:'Jumping Jacks',detail:'3 set × 30 repetisi'},
          {id:'e3',name:'High Knees',detail:'3 set × 30 detik'},
          {id:'e4',name:'Mountain Climber',detail:'3 set × 20 repetisi'},
          {id:'e5',name:'Burpees',detail:'3 set × 10 repetisi'}
        ]},
    0:{ key:'cardio', type:'training', label:'Kardio', shortLabel:'Kardio',
        tip:'Jaga detak jantung di zona sedang, fokus ke napas yang stabil.',
        exercises:[
          {id:'e1',name:'Jogging / Lari di Tempat',detail:'20–25 menit'},
          {id:'e2',name:'Jumping Jacks',detail:'3 set × 30 repetisi'},
          {id:'e3',name:'High Knees',detail:'3 set × 30 detik'},
          {id:'e4',name:'Mountain Climber',detail:'3 set × 20 repetisi'},
          {id:'e5',name:'Burpees',detail:'3 set × 10 repetisi'}
        ]},
    2:{ key:'rest', type:'rest', label:'Pemulihan', shortLabel:'Rest',
        tip:'Hari ini otot kamu tumbuh — bukan di gym, tapi di sini, saat istirahat.',
        exercises:[
          {id:'e1',name:'Stretching Ringan',detail:'10 menit, fokus area yang pegal'},
          {id:'e2',name:'Jaga Asupan Protein & Air Putih',detail:'Sepanjang hari'},
          {id:'e3',name:'Tidur Cukup',detail:'7–8 jam malam ini'}
        ]},
    4:{ key:'rest', type:'rest', label:'Pemulihan', shortLabel:'Rest',
        tip:'Hari ini otot kamu tumbuh — bukan di gym, tapi di sini, saat istirahat.',
        exercises:[
          {id:'e1',name:'Stretching Ringan',detail:'10 menit, fokus area yang pegal'},
          {id:'e2',name:'Jaga Asupan Protein & Air Putih',detail:'Sepanjang hari'},
          {id:'e3',name:'Tidur Cukup',detail:'7–8 jam malam ini'}
        ]}
  };

  var TRAINING_BODY = 'Bukan soal seberapa kelihatan urat atau serat otot. Arahnya ke bentuk badan yang proporsional & fit — kira-kira seperti postur Ryan Garcia atau Scott Eastwood di The Longest Ride. Bahu tegap, pinggang ramping, gerakan tetap ringan.';
  var TRAINING_BULLETS = [
    'Lean, bukan bulky — otot kelihatan natural saat bergerak.',
    'Proporsi lebih penting daripada ukuran semata.',
    'Konsisten tiap hari ngalahin latihan berat sesekali.'
  ];
  var REST_BODY = 'Otot tumbuh saat istirahat, bukan cuma saat latihan berat. Target bentuk badan proporsional & fit ala Ryan Garcia atau Scott Eastwood di The Longest Ride juga dibangun dari hari-hari kayak gini.';
  var REST_BULLETS = [
    'Otot butuh recovery buat berkembang, bukan cuma volume latihan.',
    'Tidur & asupan protein sama pentingnya dengan sesi latihan.',
    'Konsisten tiap hari ngalahin latihan berat sesekali.'
  ];

  /* ---------------- state ---------------- */
  var today = new Date();
  var todayDow = today.getDay();
  var todayKey = fmtKey(today);
  var viewingDow = todayDow;
  var checkedToday = [];
  var completedDates = [];
  var muted = false;

  function fmtKey(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  /* ---------------- storage helpers ---------------- */
  function hasStorage(){
    return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
  }
  function storageGetSafe(key){
    if (!hasStorage()) return Promise.resolve(null);
    try{
      return window.storage.get(key, false).then(function(res){ return res ? res.value : null; }).catch(function(){ return null; });
    }catch(e){ return Promise.resolve(null); }
  }
  function storageSetSafe(key, value){
    if (!hasStorage()) return Promise.resolve(null);
    try{
      return window.storage.set(key, value, false).catch(function(err){ console.error('storage set failed', err); });
    }catch(e){ return Promise.resolve(null); }
  }

  /* ---------------- els ---------------- */
  var el = {};
  ['landing','app','enterBtn','bgAudio','muteBtn','muteIconOn','muteIconOff',
   'streakBadge','streakCount','dateEyebrow','weekStrip','sessionCard','stampOverlay',
   'tagPill','progressCaption','cardTitle','cardTip','backTodayBtn','exList',
   'progressTrack','progressFill','popupOverlay','popupCloseX','popupCloseBtn',
   'popupEyebrow','popupTitle','popupBody','popupBullets','popupStreak'
  ].forEach(function(id){ el[id] = document.getElementById(id); });

  var lastFocused = null;

  /* ---------------- landing / audio ---------------- */
  function enterApp(){
    try{
      el.bgAudio.loop = true;
      var p = el.bgAudio.play();
      if (p && p.catch) p.catch(function(){});
    }catch(e){}
    el.landing.classList.add('leaving');
    setTimeout(function(){ el.landing.style.display = 'none'; }, 650);
    el.app.classList.add('visible');
  }
  el.landing.addEventListener('click', function(e){
    if (el.landing.classList.contains('leaving')) return;
    enterApp();
  });

  el.muteBtn.addEventListener('click', function(){
    muted = !muted;
    el.bgAudio.muted = muted;
    el.muteIconOn.style.display = muted ? 'none' : '';
    el.muteIconOff.style.display = muted ? '' : 'none';
    el.muteBtn.setAttribute('aria-label', muted ? 'Nyalakan suara' : 'Matikan suara');
  });

  /* ---------------- date header ---------------- */
  function renderDateEyebrow(){
    el.dateEyebrow.textContent = DOW_FULL[todayDow] + ', ' + today.getDate() + ' ' + MONTHS[today.getMonth()] + ' ' + today.getFullYear();
  }

  /* ---------------- week strip ---------------- */
  function renderWeekStrip(){
    var html = WEEK_ORDER.map(function(dow){
      var plan = WEEK_PLAN[dow];
      var isToday = dow === todayDow;
      var isActive = dow === viewingDow;
      return '<button class="day-pill'+(isToday?' is-today':'')+(isActive?' is-active':'')+'" data-dow="'+dow+'" aria-pressed="'+isActive+'">'
        + '<span class="day-pill-label">'+DOW_SHORT[dow]+'</span>'
        + '<span class="day-pill-cat">'+plan.shortLabel+'</span>'
        + '<span class="day-pill-dot"></span>'
        + '</button>';
    }).join('');
    el.weekStrip.innerHTML = html;
    Array.prototype.forEach.call(el.weekStrip.querySelectorAll('.day-pill'), function(btn){
      btn.addEventListener('click', function(){
        viewingDow = parseInt(btn.getAttribute('data-dow'), 10);
        renderAll();
      });
    });
  }

  /* ---------------- session card ---------------- */
  function isTodayComplete(){
    var plan = WEEK_PLAN[todayDow];
    return checkedToday.length === plan.exercises.length && plan.exercises.length > 0;
  }

  function buildRows(plan, isToday){
    return plan.exercises.map(function(ex, i){
      var num = String(i+1).padStart(2,'0');
      if (isToday){
        var checked = checkedToday.indexOf(ex.id) >= 0;
        return '<button class="ex-row" role="checkbox" aria-checked="'+checked+'" data-id="'+ex.id+'">'
          + '<span class="ex-num">'+num+'</span>'
          + '<span class="ex-check"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
          + '<span class="ex-text"><span class="ex-name">'+ex.name+'</span><span class="ex-detail">'+ex.detail+'</span></span>'
          + '</button>';
      }
      return '<div class="ex-row ex-row--preview">'
        + '<span class="ex-num">'+num+'</span>'
        + '<span class="ex-text"><span class="ex-name">'+ex.name+'</span><span class="ex-detail">'+ex.detail+'</span></span>'
        + '</div>';
    }).join('');
  }

  function renderSessionCard(){
    var plan = WEEK_PLAN[viewingDow];
    var isToday = viewingDow === todayDow;

    if (!isToday){
      el.tagPill.className = 'tag-pill tag-pill--preview';
      el.tagPill.textContent = 'PRATINJAU · ' + DOW_SHORT[viewingDow];
      el.progressCaption.textContent = plan.exercises.length + ' gerakan';
      el.backTodayBtn.hidden = false;
      el.progressTrack.hidden = true;
    } else {
      var done = isTodayComplete();
      el.tagPill.className = 'tag-pill ' + (done ? 'tag-pill--done' : 'tag-pill--today');
      el.tagPill.textContent = done ? '✓ SELESAI' : 'HARI INI';
      el.progressCaption.textContent = checkedToday.length + '/' + plan.exercises.length + ' selesai';
      el.backTodayBtn.hidden = true;
      el.progressTrack.hidden = false;
      el.progressFill.style.width = (plan.exercises.length ? (checkedToday.length/plan.exercises.length*100) : 0) + '%';
    }

    el.cardTitle.textContent = plan.label;
    el.cardTip.textContent = plan.tip;
    el.exList.innerHTML = buildRows(plan, isToday);

    if (isToday){
      Array.prototype.forEach.call(el.exList.querySelectorAll('.ex-row[role="checkbox"]'), function(row){
        row.addEventListener('click', function(){ toggleExercise(row.getAttribute('data-id')); });
      });
    }
  }

  function toggleExercise(id){
    if (viewingDow !== todayDow) return;
    var wasComplete = isTodayComplete();
    var idx = checkedToday.indexOf(id);
    if (idx >= 0) checkedToday.splice(idx,1); else checkedToday.push(id);
    storageSetSafe('whd:day:'+todayKey, JSON.stringify({checked:checkedToday}));

    var nowComplete = isTodayComplete();
    renderSessionCard();

    if (nowComplete && !wasComplete){
      markDateCompleted(todayKey);
      celebrateCompletion();
    } else if (!nowComplete && wasComplete){
      unmarkDateCompleted(todayKey);
    }
  }

  /* ---------------- completion / streak ---------------- */
  function markDateCompleted(key){
    if (completedDates.indexOf(key) === -1){
      completedDates.push(key);
      storageSetSafe('whd:completed-dates', JSON.stringify(completedDates));
    }
    renderStreak();
  }
  function unmarkDateCompleted(key){
    var i = completedDates.indexOf(key);
    if (i >= 0){
      completedDates.splice(i,1);
      storageSetSafe('whd:completed-dates', JSON.stringify(completedDates));
    }
    renderStreak();
  }
  function computeStreak(){
    var set = {};
    completedDates.forEach(function(d){ set[d]=true; });
    var streak = 0;
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    while (set[fmtKey(d)]){
      streak++;
      d.setDate(d.getDate()-1);
    }
    return streak;
  }
  function renderStreak(){
    var streak = computeStreak();
    if (streak >= 1){
      el.streakBadge.hidden = false;
      el.streakCount.textContent = streak;
    } else {
      el.streakBadge.hidden = true;
    }
  }

  /* ---------------- stamp + popup ---------------- */
  function celebrateCompletion(){
    el.stampOverlay.classList.add('play');
    setTimeout(openPopup, 700);
    setTimeout(function(){ el.stampOverlay.classList.remove('play'); }, 2600);
  }

  function openPopup(){
    var plan = WEEK_PLAN[todayDow];
    var isRest = plan.type === 'rest';
    el.popupEyebrow.textContent = isRest ? 'PEMULIHAN SELESAI' : 'SESI SELESAI';
    el.popupTitle.textContent = isRest ? 'Tetap di Jalur.' : 'Target Kamu.';
    el.popupBody.textContent = isRest ? REST_BODY : TRAINING_BODY;
    el.popupBullets.innerHTML = (isRest ? REST_BULLETS : TRAINING_BULLETS).map(function(b){ return '<li>'+b+'</li>'; }).join('');

    var streak = computeStreak();
    if (streak >= 2){
      el.popupStreak.hidden = false;
      el.popupStreak.textContent = 'Streak kamu: ' + streak + ' hari berturut-turut.';
    } else {
      el.popupStreak.hidden = true;
    }

    lastFocused = document.activeElement;
    el.popupOverlay.classList.add('open');
    el.popupOverlay.setAttribute('aria-hidden','false');
    setTimeout(function(){ el.popupCloseBtn.focus(); }, 60);
  }
  function closePopup(){
    el.popupOverlay.classList.remove('open');
    el.popupOverlay.setAttribute('aria-hidden','true');
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  el.popupCloseBtn.addEventListener('click', closePopup);
  el.popupCloseX.addEventListener('click', closePopup);
  el.popupOverlay.addEventListener('click', function(e){ if (e.target === el.popupOverlay) closePopup(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && el.popupOverlay.classList.contains('open')) closePopup();
  });

  el.backTodayBtn.addEventListener('click', function(){ viewingDow = todayDow; renderAll(); });

  /* ---------------- render all ---------------- */
  function renderAll(){
    renderDateEyebrow();
    renderWeekStrip();
    renderSessionCard();
    renderStreak();
  }

  /* ---------------- init ---------------- */
  function init(){
    Promise.all([
      storageGetSafe('whd:day:'+todayKey),
      storageGetSafe('whd:completed-dates')
    ]).then(function(results){
      var dayData = results[0];
      var completedData = results[1];
      if (dayData){
        try{ checkedToday = JSON.parse(dayData).checked || []; }catch(e){ checkedToday = []; }
      }
      if (completedData){
        try{ completedDates = JSON.parse(completedData) || []; }catch(e){ completedDates = []; }
      }
      renderAll();
    }).catch(function(){ renderAll(); });
  }

  init();
})();
</script>
</body>
</html>
